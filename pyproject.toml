[project]
name = "energy-price-forecast"
version = "0.1.0"
description = "Day-ahead electricity price forecasting for Germany, with prediction intervals, anomaly detection and monitoring"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "lightgbm>=4.3",
    "scikit-learn>=1.5",
    "holidays>=0.50",
    "requests>=2.32",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "joblib>=1.4",
]

[project.optional-dependencies]
research = ["mlflow>=3.0", "shap>=0.46", "matplotlib>=3.9", "statsmodels>=0.14"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
