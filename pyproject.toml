[project]
name = "energy-price-forecast"
version = "0.1.0"
description = "Day-ahead electricity price forecasting for Germany, with prediction intervals, anomaly detection and monitoring"
requires-python = ">=3.12"
dependencies = [
    # Pinned to the tested versions: the saved model (models/champion.joblib) must load the same way everywhere.
    "pandas==3.1.0",
    "numpy==2.5.4",
    "pyarrow==25.0.1",
    "lightgbm==4.7.0",
    "scikit-learn==1.9.1",
    "holidays==0.107",
    "requests==2.34.2",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "joblib==1.6.0",
]

[project.optional-dependencies]
research = ["mlflow>=3.0", "shap>=0.46", "matplotlib>=3.9", "statsmodels>=0.14"]
notebook = ["jupyterlab>=4", "ipykernel>=6"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
