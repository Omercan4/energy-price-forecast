# Scans the whole git history for API keys, tokens and passwords on every push and pull request, and once a week.
# A leak fails the run. gitleaks is downloaded as a pinned release and checked against its published checksum.
name: secret-scan

on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"   # Mondays, 05:17 UTC

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the full history, not only the last commit
      - name: Download gitleaks and verify the checksum
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -O "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -O "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
      - name: Scan the history (values are redacted in the log)
        run: ./gitleaks detect --source . --redact --verbose --no-banner
